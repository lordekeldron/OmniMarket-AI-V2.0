[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnimarket-consumer-simulation"
version = "0.1.0"
description = "Motor vetorizado de simulação de consumidores para marketing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["consumer_simulation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
